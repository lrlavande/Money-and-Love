<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="Notre budget"/>
<title>Notre budget</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --acc:#6f9c86;--acc-dark:#4b7a64;--acc-deep:#33584a;--acc-soft:#e3efe8;--acc-pale:#f2f8f4;--acc-border:#d2e4d9;--bg:#f6faf7;
  --text:#24312b;--text-2:#4f5f57;--muted:#86958d;--line:#e4ece7;
  --in:#3f9a6e;--out:#c4566c;--warn:#c98a35;
  --r-lg:20px;--r-xl:28px;
  --shadow-sm:0 1px 2px rgba(30,50,40,.04),0 1px 3px rgba(30,50,40,.06);
  --shadow-lg:0 4px 12px rgba(30,50,40,.06),0 16px 40px rgba(30,50,40,.10);
  --sans:'Manrope',-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
body[data-theme=lavande]{--acc:#a88bd0;--acc-dark:#6f5590;--acc-deep:#4e3a6a;--acc-soft:#f0e9f8;--acc-pale:#f7f2fc;--acc-border:#e4d7f0;--bg:#faf6fd;--line:#ece2f3;}
body[data-theme=peche]{--acc:#e0957a;--acc-dark:#c06e55;--acc-deep:#8f4c39;--acc-soft:#fbe9e2;--acc-pale:#fdf4f0;--acc-border:#f3d8cd;--bg:#fdf8f5;--line:#f3e6df;}
body[data-theme=ocean]{--acc:#6b9bd1;--acc-dark:#44729f;--acc-deep:#2f5277;--acc-soft:#e4eef8;--acc-pale:#f2f7fc;--acc-border:#d3e2f2;--bg:#f6f9fd;--line:#e2eaf3;}
body[data-theme=sable]{--acc:#c9a46a;--acc-dark:#9c7a42;--acc-deep:#6e552c;--acc-soft:#f6eedf;--acc-pale:#fbf7ef;--acc-border:#ecdcc0;--bg:#fcfaf5;--line:#efe6d6;}
body[data-theme=prune]{--acc:#8e5a7e;--acc-dark:#6d3f5f;--acc-deep:#4d2a43;--acc-soft:#f1e5ee;--acc-pale:#f8f1f6;--acc-border:#e3cfdd;--bg:#fbf7fa;--line:#eee2ea;}
body[data-theme=ardoise]{--acc:#6b7a8f;--acc-dark:#4a5869;--acc-deep:#323d4a;--acc-soft:#e7ebf0;--acc-pale:#f3f5f8;--acc-border:#d5dce5;--bg:#f7f8fa;--line:#e3e7ec;}
body[data-theme=rose]{--acc:#d98aa8;--acc-dark:#b5607f;--acc-deep:#84435d;--acc-soft:#f8e6ed;--acc-pale:#fcf3f6;--acc-border:#f0d3de;--bg:#fdf7f9;--line:#f2e4ea;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh;-webkit-text-size-adjust:100%;letter-spacing:-.01em;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,select,textarea{font-family:inherit;font-size:16px;width:100%;border:1.5px solid transparent;border-radius:12px;padding:11px 13px;background:var(--acc-pale);color:var(--text);outline:none;transition:all .15s;}
input:focus,select:focus,textarea:focus{background:#fff;border-color:var(--acc);}
input[type=date],input[type=month]{-webkit-appearance:none;appearance:none;min-height:46px;display:block;text-align:left;}
textarea{resize:vertical;min-height:70px;}
.wrap{max-width:480px;margin:0 auto;padding:0 14px 110px;}
.top{display:flex;align-items:center;gap:12px;padding:20px 4px 4px;}
.hello{font-size:1.45rem;font-weight:800;letter-spacing:-.025em;}
.top-sub{font-size:.78rem;color:var(--muted);font-weight:600;margin-top:3px;cursor:pointer;}
.top-sub b{color:var(--acc-dark);}
.icon-btn{width:42px;height:42px;border-radius:14px;background:#fff;border:1px solid var(--acc-border);box-shadow:var(--shadow-sm);font-size:1.15rem;color:var(--acc-dark);flex-shrink:0;margin-left:auto;}
.page{display:none;}
.page.active{display:block;animation:pin .25s ease;}
@keyframes pin{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
.ptitle{font-size:1.25rem;font-weight:800;letter-spacing:-.02em;padding:14px 4px 2px;}
.mswitch{display:flex;align-items:center;justify-content:space-between;background:#fff;border:1px solid var(--line);border-radius:16px;padding:6px;margin:10px 0 12px;box-shadow:var(--shadow-sm);}
.mswitch button{width:38px;height:38px;border-radius:11px;background:var(--acc-soft);color:var(--acc-dark);font-size:1.25rem;font-weight:800;}
.mswitch .ml{font-weight:800;text-transform:capitalize;text-align:center;font-size:1rem;}
.mswitch .ml small{display:block;font-size:.7rem;color:var(--acc-dark);font-weight:700;text-transform:none;cursor:pointer;margin-top:1px;}
.seg{display:flex;gap:4px;background:var(--acc-soft);border-radius:14px;padding:4px;margin-bottom:12px;}
.seg button{flex:1;padding:9px 4px;border-radius:10px;font-size:.8rem;font-weight:700;color:var(--muted);}
.seg button.on{background:#fff;color:var(--acc-deep);box-shadow:var(--shadow-sm);}
.hero{background:linear-gradient(160deg,var(--acc-dark),var(--acc-deep));color:#fff;border-radius:var(--r-xl);padding:18px;box-shadow:var(--shadow-lg);position:relative;overflow:hidden;margin-bottom:12px;}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 85% 10%,rgba(255,255,255,.16),transparent 55%);pointer-events:none;}
.hero>*{position:relative;}
.hero .k{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;opacity:.82;}
.hero .big{font-size:2.3rem;font-weight:800;letter-spacing:-.04em;line-height:1.05;margin-top:10px;}
.hero .big.neg{color:#ffc7d1;}
.hero .s{font-size:.82rem;opacity:.9;margin-top:6px;line-height:1.45;font-weight:500;}
.hero .row{display:flex;gap:8px;margin-top:14px;}
.pill2{flex:1;background:rgba(255,255,255,.14);border-radius:12px;padding:8px 10px;min-width:0;}
.pill2 .l{font-size:.66rem;opacity:.82;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pill2 .v{font-size:.95rem;font-weight:800;margin-top:2px;white-space:nowrap;}
.hero .hb{height:8px;background:rgba(255,255,255,.2);border-radius:99px;overflow:hidden;margin-top:14px;}
.hero .hb i{display:block;height:100%;background:#fbe7c4;border-radius:99px;transition:width .4s;}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;box-shadow:var(--shadow-sm);margin-bottom:12px;}
.card h3{font-size:1rem;font-weight:800;margin-bottom:10px;letter-spacing:-.01em;}
.card h3 small{font-size:.74rem;color:var(--muted);font-weight:600;margin-left:4px;}
.sec-t{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:.72rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;padding:16px 4px 8px;}
.sec-t span:last-child{text-transform:none;letter-spacing:0;font-size:.78rem;color:var(--text-2);}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.tile{text-align:left;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:var(--shadow-sm);min-width:0;transition:transform .1s;}
.tile:active{transform:scale(.98);}
.tile .n{font-size:.8rem;font-weight:700;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tile .v{font-size:1.08rem;font-weight:800;margin-top:4px;letter-spacing:-.02em;}
.tile .b{font-size:.7rem;color:var(--muted);font-weight:600;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tile.rev .v{color:var(--in);}
.tile.over .v{color:var(--out);}
.tile.mv .v{color:var(--acc-deep);}
.tile.ptn{border-style:dashed;}
.tile.add{border:1.5px dashed var(--acc-border);background:transparent;box-shadow:none;color:var(--acc-dark);font-weight:700;font-size:.82rem;display:flex;align-items:center;justify-content:center;min-height:76px;text-align:center;}
.bar{height:5px;background:var(--acc-soft);border-radius:99px;overflow:hidden;margin-top:8px;}
.bar i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .4s;}
.bar.over i{background:var(--out);}
.bar.rev i{background:var(--in);}
.btn{display:block;width:100%;padding:13px;border-radius:14px;background:var(--acc-dark);color:#fff;font-weight:800;font-size:.92rem;text-align:center;}
.btn:active{transform:translateY(1px);}
.btn.ghost{background:var(--acc-soft);color:var(--acc-deep);}
.btn.dashed{background:#fff;border:1.5px dashed var(--acc);color:var(--acc-deep);box-shadow:var(--shadow-sm);}
.btn.danger{background:#fbe9ec;color:var(--out);}
.btn.sm{display:inline-block;width:auto;padding:8px 12px;font-size:.8rem;border-radius:10px;}
.btn+.btn{margin-top:8px;}
.btns{display:flex;gap:8px;margin-top:10px;}
.btns .btn{margin-top:0;}
.lbl{display:block;font-size:.72rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin:14px 0 6px;}
.chips{display:flex;flex-wrap:wrap;gap:6px;}
.chip{padding:8px 12px;border-radius:99px;background:var(--acc-pale);border:1.5px solid var(--line);font-size:.8rem;font-weight:700;color:var(--text-2);}
.chip.on{background:var(--acc-dark);border-color:var(--acc-dark);color:#fff;}
.chip-sec{font-size:.66rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:10px 0 6px;}
.line{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer;}
.line:last-child{border-bottom:none;}
.line .d{width:38px;text-align:center;flex-shrink:0;}
.line .d b{display:block;font-size:1rem;font-weight:800;color:var(--acc-dark);line-height:1;}
.line .d span{font-size:.6rem;color:var(--muted);font-weight:700;text-transform:uppercase;}
.line .m{flex:1;min-width:0;}
.line .t{font-size:.86rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.line .c{font-size:.76rem;color:var(--muted);margin-top:3px;line-height:1.35;word-break:break-word;}
.line .a{font-weight:800;font-size:.92rem;white-space:nowrap;}
.a.in{color:var(--in);}
.a.out{color:var(--out);}
.a.mv{color:var(--acc-deep);}
.tag{display:inline-block;font-size:.62rem;font-weight:800;padding:2px 7px;border-radius:99px;margin-right:4px;vertical-align:1px;letter-spacing:0;}
.tag.depense{background:#fbe9ec;color:var(--out);}
.tag.revenu{background:#e3f4ea;color:var(--in);}
.tag.virement{background:var(--acc-soft);color:var(--acc-deep);}
.tag.who{background:#f3ece0;color:#8a6a33;}
.backdrop{position:fixed;inset:0;background:rgba(25,35,30,.45);display:none;align-items:flex-end;justify-content:center;z-index:50;backdrop-filter:blur(4px);}
.backdrop.open{display:flex;animation:fade .2s;}
@keyframes fade{from{opacity:0;}to{opacity:1;}}
.sheet{width:min(480px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:var(--r-xl) var(--r-xl) 0 0;padding:8px 18px calc(24px + env(safe-area-inset-bottom));animation:up .28s cubic-bezier(.3,.6,.3,1);overscroll-behavior:contain;}
@keyframes up{from{transform:translateY(24px);opacity:0;}to{transform:none;opacity:1;}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--acc-border);margin:8px auto 14px;}
.sh-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:4px;}
.sh-head h2{font-size:1.2rem;font-weight:800;letter-spacing:-.02em;}
.sh-sub{font-size:.78rem;color:var(--muted);font-weight:600;margin-top:3px;}
.x{width:34px;height:34px;border-radius:10px;background:var(--acc-soft);color:var(--acc-dark);font-weight:800;flex-shrink:0;}
.amount-in{font-size:2rem !important;font-weight:800;text-align:center;padding:14px !important;letter-spacing:-.03em;}
.cat-total{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;background:var(--acc-pale);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:12px;}
.cat-total .l{font-size:.7rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.07em;}
.cat-total .v{font-size:1.6rem;font-weight:800;letter-spacing:-.03em;margin-top:3px;}
.inline-in{display:inline-flex;align-items:center;gap:5px;background:#fff;border:1px solid var(--acc-border);border-radius:12px;padding:2px 10px;}
.inline-in input{width:84px;background:transparent;border:0;padding:7px 0;text-align:right;font-weight:800;font-size:16px;}
.inline-in input:focus{background:transparent;}
.inline-in span{color:var(--muted);font-weight:700;}
.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.94);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(6,1fr);gap:2px;z-index:40;}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 1px;border-radius:12px;font-size:.6rem;letter-spacing:-.02em;font-weight:700;color:var(--muted);min-height:52px;justify-content:center;}
.nav button.on{background:var(--acc-soft);color:var(--acc-deep);}
.nav svg{width:22px;height:22px;image-rendering:pixelated;display:block;}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(16px);background:var(--text);color:#fff;padding:12px 16px;border-radius:14px;font-size:.86rem;font-weight:600;opacity:0;pointer-events:none;transition:all .25s;z-index:80;width:max-content;max-width:calc(100% - 32px);text-align:center;line-height:1.4;box-shadow:var(--shadow-lg);}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.kpi{background:var(--acc-pale);border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0;}
.kpi .l{font-size:.66rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em;}
.kpi .v{font-size:1.12rem;font-weight:800;margin-top:4px;letter-spacing:-.02em;}
.hbar{padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer;}
.hbar:last-child{border-bottom:none;}
.hbar .t2{display:flex;justify-content:space-between;font-size:.86rem;font-weight:700;gap:8px;}
.hbar .t2 span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.hbar .t2 span:last-child{white-space:nowrap;}
.hbar .s2{font-size:.72rem;color:var(--muted);font-weight:600;margin-top:2px;}
.hbar .s2.over{color:var(--out);}
.cols{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:8px;}
.col{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;min-width:0;}
.col .pair{flex:1;display:flex;align-items:flex-end;gap:3px;width:100%;justify-content:center;}
.col .pair i{width:38%;max-width:16px;border-radius:5px 5px 2px 2px;display:block;min-height:2px;}
.col .pair i.o{background:var(--out);opacity:.8;}
.col .pair i.n{background:var(--in);opacity:.8;}
.col small{font-size:.64rem;color:var(--muted);font-weight:700;text-transform:capitalize;}
.col.cur small{color:var(--acc-deep);font-weight:800;}
.legend{display:flex;gap:14px;margin-top:10px;font-size:.72rem;color:var(--text-2);font-weight:600;}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;}
.acc-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;font-size:.86rem;color:var(--text-2);font-weight:600;}
.acc-row b{color:var(--text);font-weight:800;white-space:nowrap;}
.acc-row.tot{border-top:2px solid var(--acc-border);margin-top:6px;padding-top:10px;font-size:.95rem;}
.acc-row.tot b{color:var(--acc-deep);}
.muted{color:var(--muted);font-size:.8rem;font-weight:500;line-height:1.5;}
.empty{text-align:center;color:var(--muted);font-size:.86rem;padding:18px 12px;background:var(--acc-pale);border-radius:14px;line-height:1.5;}
.ecart{font-size:.78rem;font-weight:700;margin-top:8px;padding:8px 10px;border-radius:10px;line-height:1.4;}
.ecart.ok{background:#e3f4ea;color:var(--in);}
.ecart.ko{background:#fbf0e1;color:#94621f;}
.theme-dots{display:flex;gap:10px;flex-wrap:wrap;}
.theme-dots button{width:36px;height:36px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px var(--line);}
.theme-dots button.on{box-shadow:0 0 0 2.5px var(--text);}
.err{font-size:.82rem;color:var(--out);background:#fbe9ec;padding:9px 12px;border-radius:10px;margin-top:10px;display:none;font-weight:600;}
.err.show{display:block;}
.month-card{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);margin-bottom:10px;box-shadow:var(--shadow-sm);overflow:hidden;}
.month-head{display:flex;align-items:center;gap:10px;padding:14px 16px;cursor:pointer;}
.month-head .mn{font-weight:800;text-transform:capitalize;font-size:.98rem;}
.month-head .ms{font-size:.74rem;color:var(--muted);font-weight:600;margin-top:2px;}
.month-head .chev{margin-left:auto;color:var(--muted);font-size:1.1rem;transition:transform .2s;}
.month-card.open .chev{transform:rotate(90deg);}
.month-body{display:none;padding:0 16px 14px;border-top:1px solid var(--line);}
.month-card.open .month-body{display:block;}
.note-box{background:#fbf6ea;border:1px solid #f0e3c4;border-radius:12px;padding:10px 12px;font-size:.82rem;color:#7a5f2c;margin-top:10px;line-height:1.45;}
.split{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--acc-soft);margin:8px 0 4px;}
.split i{display:block;height:100%;}
.goal-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.goal-grid .full{grid-column:1/-1;}
.gfield{background:var(--acc-pale);border:1px solid var(--line);border-radius:14px;padding:10px 12px;}
.gfield label{display:block;font-size:.66rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em;}
.gfield input,.gfield select{background:transparent;border:0;padding:4px 0 0;font-weight:800;font-size:1.05rem;border-radius:0;}
.gfield input:focus,.gfield select:focus{background:transparent;}
.sav-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);}
.sav-row:last-child{border-bottom:none;}
.sav-row .mn{flex:1;min-width:0;}
.sav-row .mn b{display:block;font-size:.88rem;text-transform:capitalize;}
.sav-row .mn span{font-size:.74rem;color:var(--muted);font-weight:600;}
.sav-row.now{background:var(--acc-pale);margin:0 -10px;padding:10px;border-radius:12px;border-bottom:none;}
.search{display:flex;gap:8px;margin:10px 0;}
@media(max-width:360px){.hero .big{font-size:2rem;}.tiles{gap:6px;}.wrap{padding-left:10px;padding-right:10px;}}
</style>
</head>
<body data-theme="sauge">
<div class="wrap">
  <header class="top">
    <div style="min-width:0;">
      <div class="hello" id="hello" onclick="openSettings()" style="cursor:pointer;">Coucou !</div>
      <div class="top-sub" id="top-sub" onclick="openSettings('duo')"></div>
    </div>
    <button class="icon-btn" onclick="openSettings()" aria-label="Réglages">&#x2699;</button>
  </header>
  <section class="page active" id="pg-saisie"></section>
  <section class="page" id="pg-budget"></section>
  <section class="page" id="pg-bilan"></section>
  <section class="page" id="pg-synth"></section>
  <section class="page" id="pg-epargne"></section>
  <section class="page" id="pg-hist"></section>
</div>

<nav class="nav" id="nav">
  <button class="on" data-pg="saisie" onclick="go('saisie')">
    <svg viewBox="0 0 16 16"><rect x="3" y="1" width="10" height="14" fill="currentColor"/><rect x="4" y="2" width="8" height="12" fill="#fff" opacity=".92"/><rect x="5" y="4" width="6" height="1" fill="currentColor" opacity=".5"/><rect x="5" y="6" width="6" height="1" fill="currentColor" opacity=".5"/><rect x="5" y="8" width="4" height="1" fill="currentColor" opacity=".5"/><rect x="10" y="9" width="3" height="4" fill="#3f9a6e"/><rect x="11" y="7" width="1" height="3" fill="#3f9a6e"/></svg>Saisie
  </button>

<script>
const KEY="duo-budget-v1";
const ACC={perso:"Mon compte à vue",commun:"Compte commun",epargne:"Épargne long terme"};
const ACC_S={perso:"Mon compte",commun:"Commun",epargne:"Épargne"};
const TYPE_L={depense:"Dépense",revenu:"Revenu",virement:"Virement"};
const THEMES={sauge:"#6f9c86",lavande:"#a88bd0",peche:"#e0957a",ocean:"#6b9bd1",rose:"#d98aa8",sable:"#c9a46a",prune:"#8e5a7e",ardoise:"#6b7a8f"};
const COLORS=["#6f9c86","#d9a860","#c4566c","#6b9bd1","#a88bd0","#e0957a","#4f8a8b","#d98aa8","#8e9b5a","#7a6aa8"];
const pad=n=>String(n).padStart(2,"0");
const isoOf=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>isoOf(new Date());
const monthOf=iso=>String(iso).slice(0,7);
const addM=(m,n)=>{const[y,mo]=m.split("-").map(Number);const d=new Date(y,mo-1+n,1);return `${d.getFullYear()}-${pad(d.getMonth()+1)}`;};
const dAdd=(iso,n)=>{const[y,m,d]=iso.split("-").map(Number);return isoOf(new Date(y,m-1,d+n));};
const lastDay=m=>{const[y,mo]=m.split("-").map(Number);return `${m}-${pad(new Date(y,mo,0).getDate())}`;};
const mLabel=m=>{const[y,mo]=m.split("-").map(Number);return new Date(y,mo-1,1).toLocaleDateString("fr-BE",{month:"long",year:"numeric"});};
const mShort=m=>{const[y,mo]=m.split("-").map(Number);return new Date(y,mo-1,1).toLocaleDateString("fr-BE",{month:"short"}).replace(".","");};
const deM=m=>(/^[aeiouyéèh]/i.test(m)?"d'":"de ")+m;
const fmt=v=>new Intl.NumberFormat("fr-BE",{style:"currency",currency:"EUR"}).format(Math.round((v||0)*100)/100);
const fmt0=v=>fmt(v).replace(",00","");
const sgn=v=>(v>0?"+":v<0?"−":"")+fmt(Math.abs(v));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=v=>{const n=parseFloat(String(v??"").replace(/\s/g,"").replace(",",".").replace(/[^\d.\-]/g,""));return isNaN(n)?0:n;};
const $=s=>document.querySelector(s);

const DEF_CATS=[
  ["sal","Salaire","perso","Revenus","revenu"],
  ["cheq","Chèques repas","perso","Revenus","revenu"],
  ["v_com","Vers le compte commun","perso","Mise en commun","virement","commun"],
  ["v_ep","Vers l'épargne long terme","perso","Mise en commun","virement","epargne"],
  ["assur_v","Assurance voiture","perso","Voiture","depense",null,"fixe"],
  ["entretien_v","Entretien voiture","perso","Voiture","depense",null,"fixe"],
  ["taxe_v","Taxe voiture","perso","Voiture","depense",null,"fixe"],
  ["pneus","Pneus","perso","Voiture","depense",null,"fixe"],
  ["beaute","Beauté","perso","Divertissement","depense",null,"variable"],
  ["coiffeur","Coiffeur","perso","Divertissement","depense",null,"variable"],
  ["vet","Vêtements","perso","Divertissement","depense",null,"variable"],
  ["sport","Sports","perso","Divertissement","depense",null,"variable"],
  ["fun_perso","Amusement perso","perso","Divertissement","depense",null,"variable"],
  ["urgence","Fonds d'urgence","perso","Sécurité","depense",null,"variable"],
  ["loyer","Loyer","commun","Logement","depense",null,"fixe"],
  ["charges","Charges","commun","Logement","depense",null,"fixe"],
  ["internet","Internet & téléphone","commun","Logement","depense",null,"fixe"],
  ["iptv","IPTV","commun","Logement","depense",null,"variable"],
  ["courses","Courses","commun","Logement","depense",null,"fixe"],
  ["meubles","Meubles","commun","Logement","depense",null,"variable"],
  ["assur_h","Assurance habitation","commun","Logement","depense",null,"fixe"],
  ["essence","Essence","commun","Voiture","depense",null,"fixe"],
  ["pv","Contraventions","commun","Voiture","depense",null,"variable"],
  ["fun2","Amusement à deux","commun","Divertissement","depense",null,"fixe"],
  ["vacances","Vacances","commun","Divertissement","depense",null,"variable"],
  ["mutuelle","Mutuelles","commun","Sécurité","depense",null,"fixe"],
  ["c_rev","Autres entrées","commun","Entrées","revenu"],
  ["c_v_ep","Vers l'épargne long terme","commun","Vers l'épargne","virement","epargne"],
  ["interets","Intérêts","epargne","Entrées","revenu"],
  ["projet","Retrait pour un projet","epargne","Sorties","depense",null,"variable"],
  ["ep_v_com","Retour vers le commun","epargne","Sorties","virement","commun"]
];

function blank(){
  const m=monthOf(today());
  return {v:1,me:{id:uid(),name:""},partnerName:"",theme:"sauge",
    categories:DEF_CATS.map(([id,name,account,section,type,to,nature])=>({id,name,account,section,type,to:to||null,nature:type==="depense"?(nature||"variable"):null})),
    budgets:{},tx:[],start:{perso:"",commun:"",epargne:""},
    goal:{label:"Notre épargne",total:5000,monthly:200,startMonth:m,overrides:{}},
    notes:{},bank:{},partner:null};
}
let S=null;
try{S=JSON.parse(localStorage.getItem(KEY)||"null");}catch(e){S=null;}
if(!S||!S.me||!Array.isArray(S.categories)) S=blank();
["budgets","notes","bank"].forEach(k=>{if(!S[k]||typeof S[k]!=="object")S[k]={};});
if(!Array.isArray(S.tx)) S.tx=[];
if(!S.goal) S.goal=blank().goal;
if(!S.goal.overrides) S.goal.overrides={};
if(!S.sync||typeof S.sync!=="object") S.sync={url:"",key:"",pass:"",lastPush:0,lastPull:0};
let TXC=null;
function saveRaw(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){toast("Impossible d'enregistrer, le stockage est plein ou bloqué");}}
function save(){TXC=null;PSC={};saveRaw();schedulePush();}
let PSC={};
const clampDay=(m,d)=>`${m}-${pad(Math.min(d,Number(lastDay(m).slice(8))))}`;
const dayN=iso=>Number(iso.slice(8,10));
const mdiff=(a,b)=>{const[y1,m1]=a.split("-").map(Number),[y2,m2]=b.split("-").map(Number);return (y1-y2)*12+(m1-m2);};
const dDiff=(a,b)=>Math.round((new Date(a+"T12:00:00")-new Date(b+"T12:00:00"))/86400000);
function perInfo(who){
  const ck="L:"+who;
  if(PSC[ck]) return PSC[ck];
  const p=persons().find(x=>x.who===who);
  const all=p?[...new Set(p.tx.filter(t=>t.cat==="sal"&&t.type==="revenu"&&t.account==="perso").map(t=>t.date))].sort():[];
  const ds=[];all.forEach(d=>{if(!ds.length||dDiff(d,ds[ds.length-1])>15)ds.push(d);});
  const L=[];
  ds.forEach((d,i)=>{
    const len=i<ds.length-1?dDiff(ds[i+1],d):30;
    const named=monthOf(dAdd(d,Math.floor(len/2)));
    const key=L.length&&named<=L[L.length-1].key?addM(L[L.length-1].key,1):named;
    L.push({key,start:d});
  });
  return PSC[ck]=L;
}
function perStart(m,who){
  who=who||"me";
  const ck="S:"+who+":"+m;
  if(PSC[ck]) return PSC[ck];
  const L=perInfo(who);let r;
  if(!L.length) r=m+"-01";
  else{
    const f=L[0],l=L[L.length-1];
    if(m<f.key) r=clampDay(addM(monthOf(f.start),-mdiff(f.key,m)),dayN(f.start));
    else if(m>l.key) r=clampDay(addM(monthOf(l.start),mdiff(m,l.key)),dayN(l.start));
    else{const x=L.find(p=>p.key===m)||L.find(p=>p.key>m);r=x.start;}
  }
  return PSC[ck]=r;
}
const perEnd=(m,who)=>dAdd(perStart(addM(m,1),who),-1);
function perOf(iso,who){
  who=who||"me";
  const ck="O:"+who+":"+iso;
  if(PSC[ck]) return PSC[ck];
  const m=monthOf(iso);let r=m;
  for(let j=3;j>=-3;j--){const k=addM(m,j);if(perStart(k,who)<=iso&&perEnd(k,who)>=iso){r=k;break;}}
  return PSC[ck]=r;
}
const txPer=t=>perOf(t.date,t.account==="perso"?t.who:"me");
const curPer=()=>perOf(today());
const hasSalary=who=>perInfo(who||"me").length>0;
const dShort=iso=>new Date(iso+"T12:00:00").toLocaleDateString("fr-BE",{day:"numeric",month:"short"}).replace(".","");
const perRange=(m,who)=>`${dShort(perStart(m,who))} → ${dShort(perEnd(m,who))}`;

const natureOf=t=>t.nature||((catOf(t.cat,t.who)||{}).nature)||"variable";
const myName=()=>S.me.name||"Moi";
const pName=()=>S.partnerName||(S.partner&&S.partner.name)||"Partenaire";
const whoName=w=>w==="partner"?pName():myName();
function persons(){
  const l=[{who:"me",name:myName(),cats:S.categories,budgets:S.budgets,tx:S.tx,start:S.start}];
  if(S.partner) l.push({who:"partner",name:pName(),cats:S.partner.categories||[],budgets:S.partner.budgets||{},tx:S.partner.tx||[],start:S.partner.start||{}});
  return l;
}
function allTx(){if(!TXC) TXC=persons().flatMap(p=>p.tx.map(t=>({...t,who:p.who})));return TXC;}
const myCat=id=>S.categories.find(c=>c.id===id)||null;
function catOf(id,who){
  const ps=persons();const own=ps.find(p=>p.who===who);
  return (own&&own.cats.find(c=>c.id===id))||ps.flatMap(p=>p.cats).find(c=>c.id===id)||null;
}
const keyOf=(acc,who)=>acc==="perso"?"perso:"+who:acc;
function effects(t){
  const a=Number(t.amount)||0,k=keyOf(t.account,t.who);
  if(t.type==="depense") return [[k,-a]];
  if(t.type==="revenu") return [[k,a]];
  if(t.type==="virement") return [[k,-a],[keyOf(t.to||"commun",t.who),a]];
  return [];
}
const filled=v=>v!==null&&v!==undefined&&v!=="";
function cutOf(st){
  if(st&&st.date) return {date:st.date,ts:Number(st.ts)||0};
  if(st&&st.month) return {date:dAdd(st.month+"-01",-1),ts:Infinity};
  return {date:"0000-00-00",ts:Infinity};
}
function startOf(key){
  const me=S.start||{},pa=(S.partner&&S.partner.start)||{};
  if(key==="perso:me") return {cut:cutOf(me),amount:num(me.perso),src:"me"};
  if(key==="perso:partner") return {cut:cutOf(pa),amount:num(pa.perso),src:"partner"};
  if(filled(me[key])) return {cut:cutOf(me),amount:num(me[key]),src:"me"};
  if(filled(pa[key])) return {cut:cutOf(pa),amount:num(pa[key]),src:"partner"};
  return {cut:cutOf(me),amount:0,src:"me"};
}
const counts=(t,cut)=>t.date>cut.date||(t.date===cut.date&&(Number(t.created)||0)>cut.ts);
function balanceAt(key,iso){
  const st=startOf(key);
  let b=st.amount;
  for(const t of allTx()){if(t.date>iso||!counts(t,st.cut))continue;for(const[k,d] of effects(t)) if(k===key) b+=d;}
  return b;
}
function flows(key,month){
  const st=startOf(key);let i=0,o=0;
  const w=key==="perso:partner"?"partner":"me";
  if(perEnd(month,w)<st.cut.date) return {i,o};
  for(const t of allTx()){if(perOf(t.date,w)!==month||!counts(t,st.cut))continue;for(const[k,d] of effects(t)) if(k===key){if(d>0)i+=d;else o-=d;}}
  return {i,o};
}
function budgetFor(id,month,budgets){
  const l=((budgets||S.budgets)[id]||[]).slice().sort((a,b)=>a.from<b.from?-1:1);
  let v=0;for(const b of l) if(b.from<=month) v=Number(b.amount)||0;
  return v;
}
function budgetOf(c,month,owner){
  if(!c) return 0;
  if(c.account==="perso"){const p=persons().find(x=>x.who===(owner||"me"));return budgetFor(c.id,month,p?p.budgets:S.budgets);}
  const by={};
  persons().forEach(p=>(((p.budgets||{})[c.id])||[]).forEach(b=>{const o=by[b.from];if(!o||(b.at||0)>(o.at||0))by[b.from]=b;}));
  let v=0;Object.keys(by).sort().forEach(f=>{if(f<=month)v=Number(by[f].amount)||0;});
  return v;
}
function setBudget(id,month,amount,onlyThis){
  const list=(S.budgets[id]||[]).slice();
  const next=addM(month,1),c=catOf(id,"me");
  if(onlyThis&&!list.some(b=>b.from===next)) list.push({from:next,amount:c?budgetOf(c,next,"me"):budgetFor(id,next),at:Date.now()-1});
  const l=list.filter(b=>b.from!==month);
  l.push({from:month,amount:Math.max(0,num(amount)),at:Date.now()});
  l.sort((a,b)=>a.from<b.from?-1:1);
  S.budgets[id]=l;save();
}
function catTotal(c,month,whoL){
  let v=0;
  for(const t of allTx()){
    if(t.cat!==c.id||t.account!==c.account||txPer(t)!==month||!whoL.includes(t.who)) continue;
    const a=Number(t.amount)||0;
    if(c.type==="revenu") v+=t.type==="revenu"?a:-a;
    else if(c.type==="virement") v+=a;
    else v+=t.type==="revenu"?-a:a;
  }
  return v;
}
const whoListFor=(c,owner)=>c.account==="perso"?[owner||"me"]:["me","partner"];
function planRemaining(month){
  const inc={},out={};const add=(o,k,v)=>{o[k]=(o[k]||0)+v;};
  for(const p of persons()){
    for(const c of p.cats){
      if(c.archived) continue;
      const shared=c.account!=="perso";
      if(shared&&p.who==="partner"&&myCat(c.id)) continue;
      const b=budgetOf(c,month,p.who);if(!b) continue;
      const done=catTotal(c,month,shared?["me","partner"]:[p.who]);
      const rem=Math.max(0,b-done);if(!rem) continue;
      const k=keyOf(c.account,p.who);
      if(c.type==="depense") add(out,k,rem);
      else if(c.type==="revenu") add(inc,k,rem);
      else{add(out,k,rem);add(inc,keyOf(c.to,p.who),rem);}
    }
  }
  return {inc,out};
}
function sectionsOf(cats){const s=[];cats.forEach(c=>{if(!s.includes(c.section))s.push(c.section);});return s;}
function accKeys(){return ["perso:me",...(S.partner?["perso:partner"]:[]),"commun","epargne"];}
function accTitle(k){if(k==="perso:me")return "Compte à vue · "+myName();if(k==="perso:partner")return "Compte à vue · "+pName();return ACC[k];}

let PAGE="saisie",curMonth=null,curAcc="perso";
function go(p){
  PAGE=p;
  document.querySelectorAll(".page").forEach(x=>x.classList.toggle("active",x.id==="pg-"+p));
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.pg===p));
  render();window.scrollTo({top:0,behavior:"smooth"});
}
function render(){
  document.body.dataset.theme=S.theme||"sauge";
  const h=new Date().getHours();
  $("#hello").textContent=(h<18?"Coucou ":"Bonsoir ")+myName()+" !";
  const ts=$("#top-sub");
  if(syncOn()){
    const lp=S.sync.lastPull?Math.round((Date.now()-S.sync.lastPull)/60000):null;
    ts.innerHTML=SYNC_ERR?`<b style="color:var(--out);">⚠ Synchro en panne</b> · touche pour voir`
      :`🔒 Connecté·es avec <b>${esc(pName())}</b> · ${lp===null?"synchro en cours...":lp<1?"à jour":`synchro il y a ${lp} min`}`;
  }else if(S.partner){
    const d=new Date(S.partner.importedAt||S.partner.exportedAt||Date.now());
    const days=Math.floor((Date.now()-d)/86400000);
    ts.innerHTML=`Budget à deux avec <b>${esc(pName())}</b> · données ${days<=0?"importées aujourd'hui":`importées il y a ${days} j`}${days>31?" · pense à refaire l'échange":""}`;
  }else ts.innerHTML=`Pas encore les données de <b>${esc(pName())}</b> · importer`;
  ({saisie:renderSaisie,budget:renderBudget,bilan:renderBilan,synth:renderSynth,epargne:renderEpargne,hist:renderHist})[PAGE]();
}
function monthSwitch(){
  const cur=curPer();
  const custom=hasSalary();
  return `<div class="mswitch"><button onclick="shiftMonth(-1)" aria-label="Mois précédent">‹</button><div class="ml">${mLabel(curMonth)}${custom?`<small style="color:var(--muted);cursor:default;">${perRange(curMonth)}${curMonth===perInfo("me")[perInfo("me").length-1].key?" · jusqu'à la prochaine paie":curMonth>perInfo("me")[perInfo("me").length-1].key?" · en attente du salaire":""}</small>`:`<small style="color:var(--muted);cursor:default;">ton mois démarrera quand tu encodes ton salaire</small>`}${curMonth!==cur?`<small onclick="shiftMonth(0)">revenir à ce mois-ci</small>`:""}</div><button onclick="shiftMonth(1)" aria-label="Mois suivant">›</button></div>`;
}
function shiftMonth(n){curMonth=n===0?curPer():addM(curMonth,n);render();}

let INC=[];
function tileHTML(c,owner){
  const whoL=whoListFor(c,owner);
  const v=catTotal(c,curMonth,whoL);
  const p=persons().find(x=>x.who===owner)||persons()[0];
  const b=budgetOf(c,curMonth,owner);
  const over=c.type==="depense"&&b>0&&v>b;
  const cls=c.type==="revenu"?"rev":c.type==="virement"?"mv":(over?"over":"");
  let sub;
  if(c.type==="revenu") sub=b>0?`prévu ${fmt0(b)}`:"reçu ce mois";
  else if(c.type==="virement") sub=`→ ${ACC_S[c.to]}${b>0?` · prévu ${fmt0(b)}`:""}`;
  else sub=b>0?(over?`dépassé de ${fmt0(v-b)}`:`reste ${fmt0(b-v)} sur ${fmt0(b)}`):"pas de budget";
  const pct=b>0?Math.min(100,Math.max(0,v/b*100)):0;
  return `<button class="tile ${cls}${owner==="partner"?" ptn":""}" onclick="openCat('${c.id}','${owner}')">
    <div class="n">${esc(c.name)}${owner==="partner"?` <span class="tag who">${esc(pName())}</span>`:""}</div>
    <div class="v">${fmt(v)}</div><div class="b">${sub}</div>
    ${b>0?`<div class="bar ${c.type==="revenu"?"rev":over?"over":""}"><i style="width:${pct}%"></i></div>`:""}
  </button>`;
}
function renderSaisie(){
  const key=keyOf(curAcc,"me");
  const fl=flows(key,curMonth);
  const end=balanceAt(key,perEnd(curMonth));
  const plan=planRemaining(curMonth);
  const proj=end+(plan.inc[key]||0)-(plan.out[key]||0);
  const isNowOrFuture=curMonth>=curPer();
  const mine=S.categories.filter(c=>c.account===curAcc&&!c.archived);
  let partnerOnly=[];
  if(curAcc!=="perso"&&S.partner){
    partnerOnly=(S.partner.categories||[]).filter(c=>c.account===curAcc&&!myCat(c.id)&&catTotal(c,curMonth,["me","partner"])!==0);
  }
  const secs=sectionsOf(mine);
  let html=monthSwitch();
  html+=`<div class="seg">${["perso","commun","epargne"].map(a=>`<button class="${a===curAcc?"on":""}" onclick="setAcc('${a}')">${ACC_S[a]}</button>`).join("")}</div>`;
  html+=`<div class="hero">
    <div class="k">${curAcc==="perso"?"Mon compte à vue":ACC[curAcc]} · ${isNowOrFuture?"il devrait y avoir":"fin du mois"}</div>
    <div class="big ${end<0?"neg":""}">${fmt(end)}</div>
    <div class="s">${curAcc==="perso"?"Selon ce que tu as encodé":"Selon ce que vous avez encodé tous les deux"} jusqu'au ${dShort(perEnd(curMonth))}</div>
    <div class="row">
      <div class="pill2"><div class="l">Entrées du mois</div><div class="v">+${fmt0(fl.i)}</div></div>
      <div class="pill2"><div class="l">Sorties du mois</div><div class="v">−${fmt0(fl.o)}</div></div>
      ${isNowOrFuture?`<div class="pill2"><div class="l">Fin de mois</div><div class="v">${fmt0(proj)}</div></div>`:""}
    </div>
  </div>`;
  html+=`<button class="btn dashed" onclick="openTx({account:curAcc})">＋ Ajouter une ligne</button>`;
  INC=[];
  if(curAcc!=="perso"){
    const groups={};
    allTx().filter(t=>t.type==="virement"&&keyOf(t.to,t.who)===curAcc&&perOf(t.date,"me")===curMonth).forEach(t=>{
      const lab=t.account==="perso"?"De "+whoName(t.who):"Du "+ACC[t.account].toLowerCase();
      (groups[lab]=groups[lab]||[]).push(t);
    });
    const labs=Object.keys(groups);
    if(labs.length){
      const tot=labs.reduce((s,l)=>s+groups[l].reduce((x,t)=>x+Number(t.amount),0),0);
      html+=`<div class="sec-t"><span>Virements reçus</span><span>+${fmt(tot)}</span></div><div class="tiles">`;
      labs.forEach(l=>{INC.push({label:l,lines:groups[l]});const s=groups[l].reduce((x,t)=>x+Number(t.amount),0);
        html+=`<button class="tile rev" onclick="openInc(${INC.length-1})"><div class="n">${esc(l)}</div><div class="v">+${fmt(s)}</div><div class="b">${groups[l].length} virement${groups[l].length>1?"s":""}</div></button>`;});
      html+=`</div>`;
    }
  }
  secs.forEach(sec=>{
    const cs=mine.filter(c=>c.section===sec);
    const tot=cs.reduce((s,c)=>s+(c.type==="revenu"?1:-1)*catTotal(c,curMonth,whoListFor(c,"me")),0);
    html+=`<div class="sec-t"><span>${esc(sec)}</span><span>${tot===0?"":sgn(tot)}</span></div><div class="tiles">`;
    html+=cs.map(c=>tileHTML(c,"me")).join("");
    html+=`<button class="tile add" onclick="openCatForm({account:curAcc,section:${esc(JSON.stringify(sec))}})">＋ Catégorie</button></div>`;
  });
  if(partnerOnly.length){
    html+=`<div class="sec-t"><span>Catégories de ${esc(pName())}</span><span></span></div><div class="tiles">${partnerOnly.map(c=>tileHTML(c,"partner")).join("")}</div>`;
  }
  html+=`<button class="btn ghost" style="margin-top:14px;" onclick="openCatForm({account:curAcc})">＋ Nouvelle section</button>`;
  const pn=S.partner&&S.partner.notes&&S.partner.notes[curMonth];
  html+=`<div class="card" style="margin-top:14px;"><h3>Note du mois <small>${mLabel(curMonth)}</small></h3>
    <textarea placeholder="Un commentaire sur ce mois : un gros imprévu, un truc à ajuster..." oninput="saveNote(this.value)">${esc(S.notes[curMonth]||"")}</textarea>
    ${pn?`<div class="note-box"><b>${esc(pName())} :</b> ${esc(pn)}</div>`:""}</div>`;
  $("#pg-saisie").innerHTML=html;
}
function setAcc(a){curAcc=a;renderSaisie();}
function saveNote(v){if(v.trim())S.notes[curMonth]=v;else delete S.notes[curMonth];save();}

function lineHTML(t,opts){
  opts=opts||{};
  const c=catOf(t.cat,t.who);
  const d=new Date(t.date+"T12:00:00");
  const a=Number(t.amount)||0;
  let amt,cls;
  if(t.type==="virement"){
    if(opts.incoming){amt="+"+fmt(a);cls="in";}
    else{amt="→ "+fmt(a);cls="mv";}
  }else if(t.type==="revenu"){amt="+"+fmt(a);cls="in";}
  else{amt="−"+fmt(a);cls="out";}
  const title=opts.showCat?(c?c.name:"Catégorie supprimée"):(t.comment||(c?c.name:"—"));
  const sub=[];
  if(opts.showAcc) sub.push(t.account==="perso"?"Compte de "+whoName(t.who):ACC_S[t.account]);
  if(t.type==="virement") sub.push("vers "+(t.to==="perso"?"compte de "+whoName(t.who):ACC_S[t.to]));
  if(opts.showCat&&t.comment) sub.push("« "+t.comment+" »");
  return `<div class="line" onclick="editLine('${t.id}','${t.who}')">
    <div class="d"><b>${d.getDate()}</b><span>${d.toLocaleDateString("fr-BE",{month:"short"}).replace(".","")}</span></div>
    <div class="m"><div class="t">${esc(title)}</div>
      <div class="c"><span class="tag ${t.type}">${TYPE_L[t.type]}</span>${t.type==="depense"?`<span class="tag" style="background:var(--acc-pale);color:var(--muted);border:1px solid var(--line);">${natureOf(t)==="fixe"?"Fixe":"Variable"}</span>`:""}${S.partner?`<span class="tag who">${esc(whoName(t.who))}</span>`:""}${esc(sub.join(" · "))}</div></div>
    <div class="a ${cls}">${amt}</div></div>`;
}
function editLine(id,who){
  if(who==="partner"){toast(`C'est une ligne de ${pName()}, elle se modifie dans son appli`);return;}
  const back=RET;openTx({id},back);
}

let RET=null,LOCK=false;
function openSheet(html){$("#sheet").innerHTML=`<div class="grab"></div>`+html;$("#bd").classList.add("open");}
function closeSheet(){if(LOCK)return;$("#bd").classList.remove("open");RET=null;}
function head(title,sub){return `<div class="sh-head"><div><h2>${title}</h2>${sub?`<div class="sh-sub">${sub}</div>`:""}</div>${LOCK?"":`<button class="x" onclick="closeSheet()" aria-label="Fermer">✕</button>`}</div>`;}

function openCat(id,owner){
  owner=owner||"me";
  const p=persons().find(x=>x.who===owner);if(!p)return;
  const c=p.cats.find(x=>x.id===id);if(!c)return;
  RET=()=>openCat(id,owner);
  const whoL=whoListFor(c,owner);
  const tot=catTotal(c,curMonth,whoL);
  const b=budgetOf(c,curMonth,owner);
  const lines=allTx().filter(t=>t.cat===c.id&&t.account===c.account&&txPer(t)===curMonth&&whoL.includes(t.who)).sort((a,b)=>a.date<b.date?1:-1);
  const word=c.type==="revenu"?"Reçu":c.type==="virement"?"Viré":"Dépensé";
  const editable=owner==="me";
  const hist=[];for(let i=5;i>=0;i--){const m=addM(curMonth,-i);hist.push({m,v:catTotal(c,m,whoL)});}
  const maxH=Math.max(1,...hist.map(h=>h.v),b);
  const avg=hist.slice(0,5).filter(h=>h.v>0);
  const avgV=avg.length?avg.reduce((s,h)=>s+h.v,0)/avg.length:0;
  let html=head(esc(c.name),`${esc(c.section)} · ${ACC[c.account]} · <span class="tag ${c.type}">${TYPE_L[c.type]}</span>${c.type==="virement"?` vers ${ACC[c.to]}`:""}`);
  html+=`<div class="cat-total"><div><div class="l">${word} en ${mLabel(curMonth).split(" ")[0]}</div><div class="v">${fmt(tot)}</div>
    ${b>0&&c.type==="depense"?`<div class="muted" style="margin-top:2px;${tot>b?"color:var(--out);font-weight:700;":""}">${tot>b?`Dépassé de ${fmt(tot-b)}`:`Il reste ${fmt(b-tot)}`}</div>`:""}</div>
    <div style="text-align:right;"><div class="l" style="margin-bottom:5px;">${c.type==="depense"?"Budget / mois":"Prévu / mois"}</div>
      ${editable?`<div class="inline-in"><input type="text" inputmode="decimal" value="${b||""}" placeholder="0" onchange="setBudget('${c.id}',curMonth,this.value);openCat('${c.id}','me');render();"/><span>€</span></div>`:`<b>${fmt(b)}</b>`}</div></div>`;
  if(b>0) html+=`<div class="bar ${c.type==="revenu"?"rev":(tot>b&&c.type==="depense"?"over":"")}" style="height:7px;"><i style="width:${Math.min(100,tot/b*100)}%"></i></div>`;
  if(editable) html+=`<div class="muted" style="margin-top:6px;">Ce budget vaut pour ${mLabel(curMonth)} et les mois suivants. Pour une exception d'un seul mois, passe par l'onglet Budget.</div>`;
  html+=`<div class="btns"><button class="btn" onclick="openTx({account:'${c.account}',cat:'${c.id}'},RET)">＋ Ajouter${editable?"":" dans ma catégorie"}</button>${editable?`<button class="btn ghost" style="flex:0 0 auto;width:auto;" onclick="openCatForm({id:'${c.id}'},RET)">✎ Modifier</button>`:""}</div>`;
  html+=`<div class="lbl">Ce mois-ci · ${lines.length} ligne${lines.length>1?"s":""}</div>`;
  html+=lines.length?`<div>${lines.map(t=>lineHTML(t)).join("")}</div>`:`<div class="empty">Rien d'encodé dans cette catégorie ce mois-ci.</div>`;
  html+=`<div class="lbl">Les 6 derniers mois</div><div class="cols" style="height:110px;">${hist.map(h=>`<div class="col${h.m===curMonth?" cur":""}"><div class="pair"><i class="${c.type==="revenu"?"n":"o"}" style="width:55%;max-width:22px;height:${h.v>0?Math.max(3,h.v/maxH*100):0}%;"></i></div><small>${mShort(h.m)}</small></div>`).join("")}</div>`;
  if(avgV>0) html+=`<div class="muted" style="margin-top:6px;">En moyenne ${fmt(avgV)} par mois sur les mois précédents${b>0&&c.type==="depense"?(avgV>b*1.1?", ton budget est peut-être un peu court":(avgV<b*0.7?", tu pourrais baisser un peu le budget":"")):""}.</div>`;
  openSheet(html);
}
function openInc(i){
  const g=INC[i];if(!g)return;
  RET=()=>openInc(i);
  const lines=g.lines.slice().sort((a,b)=>a.date<b.date?1:-1);
  openSheet(head(esc(g.label),`Virements reçus sur ${ACC[curAcc].toLowerCase()} · ${mLabel(curMonth)}`)+
    `<div class="cat-total"><div><div class="l">Total reçu</div><div class="v" style="color:var(--in);">+${fmt(lines.reduce((s,t)=>s+Number(t.amount),0))}</div></div></div>
    <div class="lbl">Détail</div>${lines.map(t=>lineHTML(t,{incoming:true,showAcc:true})).join("")}`);
}

let CF=null;
function openCatForm(o,ret){
  RET=ret||null;
  if(o.id){const c=myCat(o.id);if(!c)return;CF={...c,budget:budgetOf(c,curMonth,"me"),isNew:false};}
  else CF={id:null,name:"",account:o.account||curAcc,section:o.section||"",type:o.account==="perso"||!o.account?"depense":"depense",to:null,budget:"",isNew:true};
  renderCatForm();
}
function renderCatForm(){
  const secs=sectionsOf(S.categories.filter(c=>c.account===CF.account&&!c.archived));
  const others=["perso","commun","epargne"].filter(a=>a!==CF.account);
  if(CF.type==="virement"&&!others.includes(CF.to)) CF.to=others[0];
  let html=head(CF.isNew?"Nouvelle catégorie":"Modifier la catégorie",CF.isNew?"Elle sera ajoutée à "+ACC[CF.account].toLowerCase():ACC[CF.account]);
  html+=`<label class="lbl">Nom</label><input id="cf-name" type="text" value="${esc(CF.name)}" placeholder="ex : Coiffeur, Crèche, Netflix..."/>`;
  html+=`<label class="lbl">Section</label><input id="cf-sec" type="text" list="cf-secs" value="${esc(CF.section)}" placeholder="Choisis ou invente une section"/><datalist id="cf-secs">${secs.map(s=>`<option value="${esc(s)}">`).join("")}</datalist>`;
  if(secs.length) html+=`<div class="chips" style="margin-top:8px;">${secs.map(s=>`<button type="button" class="chip${s===CF.section?" on":""}" onclick="cfSec(${esc(JSON.stringify(s))})">${esc(s)}</button>`).join("")}</div>`;
  if(CF.isNew) html+=`<label class="lbl">Compte</label><div class="chips">${["perso","commun","epargne"].map(a=>`<button type="button" class="chip${a===CF.account?" on":""}" onclick="cfSet('account','${a}')">${ACC_S[a]}</button>`).join("")}</div>`;
  html+=`<label class="lbl">C'est plutôt...</label><div class="seg" style="margin:0;">${["depense","revenu","virement"].map(t=>`<button type="button" class="${t===CF.type?"on":""}" onclick="cfSet('type','${t}')">${TYPE_L[t]}</button>`).join("")}</div>`;
  if(CF.type==="depense") html+=`<label class="lbl">Fixe ou variable ?</label><div class="seg" style="margin:0;">${[["fixe","Fixe"],["variable","Variable"]].map(([k,l])=>`<button type="button" class="${(CF.nature||"variable")===k?"on":""}" onclick="cfSet('nature','${k}')">${l}</button>`).join("")}</div><div class="muted" style="margin-top:4px;">Fixe = le même montant chaque mois (loyer, assurance...). Variable = ça bouge (resto, vêtements...).</div>`;
  if(CF.type==="virement") html+=`<label class="lbl">Vers</label><div class="chips">${others.map(a=>`<button type="button" class="chip${a===CF.to?" on":""}" onclick="cfSet('to','${a}')">${a==="perso"?"Mon compte":ACC[a]}</button>`).join("")}</div>`;
  html+=`<label class="lbl">${CF.type==="depense"?"Budget par mois":"Montant prévu par mois"} (optionnel)</label><input id="cf-bud" type="text" inputmode="decimal" value="${CF.budget||""}" placeholder="0 €"/>`;
  html+=`<div class="err" id="cf-err"></div><button class="btn" style="margin-top:16px;" onclick="saveCatForm()">Enregistrer</button>`;
  if(!CF.isNew) html+=`<button class="btn danger" onclick="delCat('${CF.id}')">Supprimer la catégorie</button>`;
  else if(RET===null) html+=`<button class="btn ghost" onclick="closeSheet()">Annuler</button>`;
  openSheet(html);
}
function cfSync(){CF.name=$("#cf-name").value;CF.section=$("#cf-sec").value;CF.budget=$("#cf-bud").value;}
function cfSet(k,v){cfSync();CF[k]=v;renderCatForm();}
function cfSec(s){cfSync();CF.section=s;renderCatForm();}
function saveCatForm(){
  cfSync();
  const name=CF.name.trim(),sec=CF.section.trim()||"Autres";
  const err=$("#cf-err");
  if(!name){err.textContent="Donne un nom à la catégorie";err.classList.add("show");return;}
  if(S.categories.some(c=>!c.archived&&c.account===CF.account&&c.name.toLowerCase()===name.toLowerCase()&&c.id!==CF.id)){err.textContent="Cette catégorie existe déjà sur ce compte";err.classList.add("show");return;}
  let id=CF.id;
  if(CF.isNew){id="c"+uid();S.categories.push({id,name,account:CF.account,section:sec,type:CF.type,to:CF.type==="virement"?CF.to:null,nature:CF.type==="depense"?(CF.nature||"variable"):null});}
  else{const c=myCat(id);Object.assign(c,{name,section:sec,type:CF.type,to:CF.type==="virement"?CF.to:null,nature:CF.type==="depense"?(CF.nature||"variable"):null});}
  const nb=num(CF.budget),ob=budgetOf(myCat(id),curMonth,"me");
  if(nb!==ob) setBudget(id,curMonth,nb);
  save();
  if(CF.isNew&&CF.account!==curAcc) curAcc=CF.account;
  toast(CF.isNew?`Catégorie « ${name} » ajoutée`:"Catégorie modifiée");
  render();
  if(!CF.isNew&&RET) RET(); else {LOCK=false;closeSheet();}
}
function delCat(id){
  const c=myCat(id);if(!c)return;
  const n=S.tx.filter(t=>t.cat===id).length;
  if(n){
    if(!confirm(`« ${c.name} » a ${n} ligne${n>1?"s":""}. Elles restent dans l'historique, mais la catégorie disparaît de la saisie. On y va ?`))return;
    c.archived=true;
  }else{
    if(!confirm(`Supprimer « ${c.name} » ?`))return;
    S.categories=S.categories.filter(x=>x.id!==id);delete S.budgets[id];
  }
  save();RET=null;closeSheet();render();toast("Catégorie supprimée");
}

let D=null,TXRET=null;
function defaultDate(){const c=curPer();return curMonth===c?today():(curMonth<c?perEnd(curMonth):perStart(curMonth));}
function openTx(o,ret){
  TXRET=ret||null;
  if(o&&o.id){const t=S.tx.find(x=>x.id===o.id);if(!t)return;D={...t,nature:natureOf({...t,who:"me"}),amount:String(t.amount).replace(".",",")};}
  else{
    const c=o&&o.cat?myCat(o.cat):null;
    D={id:null,account:(o&&o.account)||curAcc,cat:c?c.id:null,type:c?c.type:"depense",to:c&&c.type==="virement"?c.to:null,nature:(c&&c.nature)||"variable",date:defaultDate(),amount:"",comment:""};
  }
  renderTxForm();
  if(!D.id) setTimeout(()=>{const a=$("#f-amt");if(a)a.focus();},280);
}
function renderTxForm(){
  const cats=S.categories.filter(c=>c.account===D.account&&(!c.archived||c.id===D.cat));
  const secs=sectionsOf(cats);
  const c=D.cat?myCat(D.cat):null;
  let html=head(D.id?"Modifier la ligne":"Nouvelle ligne",D.id?"":ACC[D.account]);
  html+=`<input id="f-amt" class="amount-in" type="text" inputmode="decimal" placeholder="0,00 €" autocomplete="off" value="${esc(D.amount)}"/>`;
  if(c&&c.type==="virement") html+=`<div class="empty" style="margin-top:10px;padding:11px;">Virement de <b>${D.account==="perso"?"ton compte":ACC[D.account].toLowerCase()}</b> vers <b>${c.to==="perso"?"ton compte":ACC[c.to].toLowerCase()}</b></div>`;
  else html+=`<div class="seg" style="margin:10px 0 0;">${["depense","revenu"].map(t=>`<button type="button" class="${D.type===t?"on":""}" onclick="txSet('type','${t}')">${t==="depense"?"− Dépense":"+ Revenu / remboursement"}</button>`).join("")}</div>`;
  if(D.type==="depense") html+=`<div class="seg" style="margin:8px 0 0;">${[["fixe","Fixe"],["variable","Variable"]].map(([k,l])=>`<button type="button" class="${D.nature===k?"on":""}" onclick="txSet('nature','${k}')">${l}</button>`).join("")}</div>`;
  html+=`<label class="lbl">Compte</label><div class="chips">${["perso","commun","epargne"].map(a=>`<button type="button" class="chip${a===D.account?" on":""}" onclick="txAcc('${a}')">${ACC_S[a]}</button>`).join("")}</div>`;
  html+=`<label class="lbl">Catégorie</label>`;
  html+=secs.map(s=>`<div class="chip-sec">${esc(s)}</div><div class="chips">${cats.filter(x=>x.section===s).map(x=>`<button type="button" class="chip${x.id===D.cat?" on":""}" onclick="txCat('${x.id}')">${esc(x.name)}</button>`).join("")}</div>`).join("");
  html+=`<button type="button" class="chip" style="margin-top:10px;border-style:dashed;" onclick="txNewCat()">＋ Nouvelle catégorie</button>`;
  html+=`<label class="lbl">Date</label><input id="f-date" type="date" value="${D.date}"/>`;
  html+=`<label class="lbl">Commentaire</label><textarea id="f-com" placeholder="C'était quoi ? (optionnel)">${esc(D.comment)}</textarea>`;
  html+=`<div class="err" id="f-err"></div><button class="btn" style="margin-top:16px;" onclick="saveTx()">Enregistrer</button>`;
  if(D.id) html+=`<button class="btn danger" onclick="delTx('${D.id}')">Supprimer la ligne</button>`;
  openSheet(html);
  const a=$("#f-amt");if(a) a.addEventListener("keydown",e=>{if(e.key==="Enter")saveTx();});
}
function txSync(){D.amount=$("#f-amt").value;D.date=$("#f-date").value;D.comment=$("#f-com").value;}
function txSet(k,v){txSync();D[k]=v;renderTxForm();}
function txAcc(a){txSync();if(D.account!==a){D.account=a;D.cat=null;D.to=null;if(D.type==="virement")D.type="depense";}renderTxForm();}
function txCat(id){txSync();const c=myCat(id);if(!c)return;D.cat=id;if(c.type==="virement"){D.type="virement";D.to=c.to;}else{D.type=c.type;D.to=null;}D.nature=c.nature||"variable";renderTxForm();}
function txNewCat(){txSync();const draft={...D},r=TXRET;openCatForm({account:D.account});RET=null;
  const orig=saveCatForm;window.saveCatForm=function(){const before=S.categories.length;orig();window.saveCatForm=orig;if(S.categories.length>before){const nc=S.categories[S.categories.length-1];D={...draft,cat:nc.id,type:nc.type==="virement"?"virement":nc.type,to:nc.type==="virement"?nc.to:null};TXRET=r;renderTxForm();}};}
function saveTx(){
  txSync();
  const a=num(D.amount),err=$("#f-err");
  const fail=m=>{err.textContent=m;err.classList.add("show");};
  if(!(a>0)) return fail("Indique un montant");
  if(!D.cat) return fail("Choisis une catégorie");
  if(!D.date) return fail("Indique la date");
  const c=myCat(D.cat);
  const t={id:D.id||uid(),created:D.created||Date.now(),date:D.date,account:D.account,cat:D.cat,type:D.type,amount:Math.round(a*100)/100,comment:(D.comment||"").trim()};
  if(t.type==="virement") t.to=D.to||(c&&c.to)||"commun";
  if(t.type==="depense") t.nature=D.nature||"variable";
  if(D.id){const i=S.tx.findIndex(x=>x.id===D.id);if(i>-1)S.tx[i]=t;}else S.tx.push(t);
  save();
  PSC={};
  const newMonth=t.cat==="sal"&&t.type==="revenu"&&perStart(perOf(t.date))===t.date;
  if(perOf(t.date)!==curMonth&&(!D.id||newMonth)) curMonth=perOf(t.date);
  render();
  toast(newMonth&&!D.id?`Salaire encodé 💰 Ton budget court du ${dShort(t.date)} jusqu'à ta prochaine paie (vers le ${dShort(perStart(addM(curMonth,1)))})`:`${D.id?"Ligne modifiée":"Ajouté"} · ${t.type==="revenu"?"+":t.type==="virement"?"→ ":"−"}${fmt(t.amount)} en ${c?c.name:""}`);

function planTotals(month){
  const p={};
  persons().forEach(x=>{
    const r={inc:0,dep:0,depF:0,vir:0,virCom:0,virEp:0};
    x.cats.filter(c=>c.account==="perso"&&!c.archived).forEach(c=>{const b=budgetOf(c,month,x.who);if(c.type==="revenu")r.inc+=b;else if(c.type==="depense"){r.dep+=b;if(c.nature==="fixe")r.depF+=b;}else{r.vir+=b;if(c.to==="commun")r.virCom+=b;if(c.to==="epargne")r.virEp+=b;}});
    p[x.who]=r;
  });
  const s={comDep:0,comDepF:0,comInc:0,comToEp:0,epToCom:0,epDep:0,epInc:0};
  sharedCats().forEach(c=>{const b=budgetOf(c,month);
    if(c.account==="commun"){if(c.type==="depense"){s.comDep+=b;if(c.nature==="fixe")s.comDepF+=b;}else if(c.type==="revenu")s.comInc+=b;else if(c.to==="epargne")s.comToEp+=b;}
    else{if(c.type==="depense")s.epDep+=b;else if(c.type==="revenu")s.epInc+=b;else if(c.to==="commun")s.epToCom+=b;}});
  return {p,s};
}
function splitRatio(pt){
  if(!S.partner) return {r:.5,why:`50/50 en attendant les données de ${pName()}`};
  const a=pt.p.me.inc,b=(pt.p.partner||{}).inc||0;
  if((S.splitMode||"prorata")==="prorata"&&a>0&&b>0) return {r:a/(a+b),why:"au prorata de vos revenus prévus"};
  return {r:.5,why:(S.splitMode==="moitie"?"50/50":"50/50, il manque un salaire prévu pour faire au prorata")};

function needBlock(title,need,detail,planned,shareMe,target){

  h+=need<=0&&planned.every(x=>!x.v)?"":`<div class="ecart ${Math.abs(gap)<1?"ok":"ko"}">${Math.abs(gap)<1?"C'est pile couvert ✓":gap>0?`Il manque ${fmt(gap)} de virements prévus`:`Vous prévoyez ${fmt(-gap)} de plus que nécessaire`}</div>`;

function recal(k,diff){

  if(!S.start) S.start={};

  if(st.src==="partner"&&!S.start.date){const c=st.cut;S.start.date=c.date;S.start.ts=c.ts;}
  save();renderBilan();toast("Solde recalé sur la banque ✓");
}
function setBank(k,v){

let SYN={period:"mois",who:"all"};
function periodMonths(){
  if(SYN.period==="mois") return [curMonth];
  if(SYN.period==="3m") return [addM(curMonth,-2),addM(curMonth,-1),curMonth];
  if(SYN.period==="annee"){const y=curMonth.slice(0,4);return Array.from({length:12},(_,i)=>`${y}-${pad(i+1)}`);}
  return [...new Set(allTx().map(txPer))].sort();
}
function whoOk(t){return SYN.who==="all"||!S.partner?(S.partner?true:t.who==="me"):t.who===SYN.who;}
function aggregate(months){
  const set=new Set(months);
  const r={dep:0,inc:0,saved:0,fixe:0,cats:{},secs:{},incCats:{}};
  allTx().forEach(t=>{
    if(!set.has(txPer(t))||!whoOk(t)) return;
    const a=Number(t.amount)||0,c=catOf(t.cat,t.who),ct=c?c.type:t.type;
    if(t.type==="virement"){
      if(keyOf(t.to,t.who)==="epargne") r.saved+=a;
      if(t.account==="epargne") r.saved-=a;
      return;
    }
    if(t.account==="epargne") r.saved+=t.type==="revenu"?a:-a;
    if(ct==="revenu"){const v=t.type==="revenu"?a:-a;r.inc+=v;r.incCats[t.cat]=(r.incCats[t.cat]||0)+v;return;}
    const v=t.type==="revenu"?-a:a;
    r.dep+=v;
    if(natureOf(t)==="fixe") r.fixe+=v;
    r.cats[t.cat]=(r.cats[t.cat]||0)+v;
    const sec=(c?c.section:"Autres")+"|"+(c?c.account:t.account);
    r.secs[sec]=(r.secs[sec]||0)+v;
  });
  return r;
}
function budgetSynth(id,month){
  let b=0;const ps=persons().filter(p=>SYN.who==="all"||p.who===SYN.who);
  const c0=catOf(id,"me");
  if(c0&&c0.account!=="perso") return budgetOf(c0,month);
  ps.forEach(p=>{const c=p.cats.find(x=>x.id===id);if(c) b+=budgetOf(c,month,p.who);});
  return b;
}

let SAVWIN=null;
function goalM(m){const o=S.goal.overrides||{};return o[m]!=null?Number(o[m]):Number(S.goal.monthly)||0;}
function savedIn(m){const f=flows("epargne",m);return f.i-f.o;}
function etaInfo(saved){
  const g=S.goal,cm=curPer();
  const rest=Math.max(0,num(g.total)-saved);
  if(rest<=0) return {done:true,rest:0};
  let left=rest-Math.max(0,goalM(cm)-savedIn(cm)),m=cm,k=0;
  while(left>0&&k<600){m=addM(m,1);const gm=goalM(m);if(gm<=0&&!Object.keys(g.overrides||{}).some(x=>x>m)){k=600;break;}left-=gm;k++;}
  if(k>=600) return {never:true,rest};
  return {month:m,months:k+1,rest};
}

function setGoal(k,v){
  if(k==="total"||k==="monthly") S.goal[k]=Math.max(0,num(v));

}
function setDuration(v){
  const n=Math.round(num(v));if(!(n>0))return;
  const saved=balanceAt("epargne",today()),cm=curPer();
  const rest=Math.max(0,num(S.goal.total)-saved-Math.max(0,0-savedIn(cm)));
  S.goal.monthly=Math.ceil(rest/n);

}

const SQL_SETUP=`create table if not exists duo_sync(
  space text not null,
  owner text not null,
  data text not null,
  write_hash text not null,
  updated_at timestamptz not null default now(),
  primary key(space, owner)
);
alter table duo_sync enable row level security;
revoke all on duo_sync from anon, authenticated;

create or replace function duo_get(p_space text)
returns table(owner text, data text, updated_at timestamptz)
language sql security definer set search_path = public as $$
  select owner, data, updated_at from duo_sync where space = p_space;
$$;

create or replace function duo_put(p_space text, p_owner text, p_secret text, p_data text)
returns void
language plpgsql security definer set search_path = public as $$
declare
  h text := encode(sha256(convert_to(p_secret, 'UTF8')), 'hex');
  cur text;
begin
  if length(p_space) <> 64 or length(p_data) > 3000000 then
    raise exception 'refuse';
  end if;
  select write_hash into cur from duo_sync where space = p_space and owner = p_owner;
  if cur is null then
    insert into duo_sync(space, owner, data, write_hash) values (p_space, p_owner, p_data, h);
  elsif cur = h then
    update duo_sync set data = p_data, updated_at = now() where space = p_space and owner = p_owner;
  else
    raise exception 'interdit';
  end if;
end;
$$;

revoke all on function duo_get(text) from public;
revoke all on function duo_put(text, text, text, text) from public;
grant execute on function duo_get(text) to anon;
grant execute on function duo_put(text, text, text, text) to anon;`;

const te=new TextEncoder(),td=new TextDecoder();
const hexOf=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
const b64=u=>{let s="";const a=new Uint8Array(u);for(let i=0;i<a.length;i+=0x8000)s+=String.fromCharCode.apply(null,a.subarray(i,i+0x8000));return btoa(s);};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const sha=async s=>hexOf(await crypto.subtle.digest("SHA-256",te.encode(s)));
const syncOn=()=>!!(S.sync&&S.sync.url&&S.sync.key&&S.sync.pass);
let CK=null,SYNC_ERR="",pushT=null,SYNCING=false;
async function cryptoKey(){
  const p=S.sync.pass;
  if(CK&&CK.pass===p&&CK.owner===S.me.id) return CK;
  const space=await sha("duo-space:"+p);
  const base=await crypto.subtle.importKey("raw",te.encode(p),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:te.encode("duo-budget:"+space),iterations:250000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
  CK={pass:p,owner:S.me.id,space,key,write:await sha("duo-write:"+p+":"+S.me.id)};
  return CK;
}
async function encrypt(obj){
  const k=await cryptoKey(),iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},k.key,te.encode(JSON.stringify(obj)));
  const out=new Uint8Array(12+ct.byteLength);out.set(iv);out.set(new Uint8Array(ct),12);
  return b64(out);
}
async function decrypt(s){
  const k=await cryptoKey(),u=unb64(s);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:u.slice(0,12)},k.key,u.slice(12));
  return JSON.parse(td.decode(pt));
}
async function rpc(fn,body){
  const r=await fetch(S.sync.url.replace(/\/+$/,"")+"/rest/v1/rpc/"+fn,{method:"POST",headers:{"Content-Type":"application/json",apikey:S.sync.key,Authorization:"Bearer "+S.sync.key},body:JSON.stringify(body)});
  const t=await r.text();
  if(!r.ok){
    if(/interdit/.test(t)) throw new Error("Le serveur refuse l'écriture : la clé secrète ne correspond pas à celle utilisée au départ.");
    if(r.status===404) throw new Error("Le serveur ne trouve pas les fonctions : le script SQL a bien été lancé ?");
    if(r.status===401||r.status===403) throw new Error("Adresse ou clé du projet refusée, vérifie-les.");
    throw new Error("Erreur serveur ("+r.status+")");
  }
  return t?JSON.parse(t):null;
}
function syncPayload(){const p=payload();delete p.partner;delete p.theme;return p;}
function schedulePush(){if(!syncOn())return;clearTimeout(pushT);pushT=setTimeout(()=>pushNow(),2500);}
async function pushNow(){
  if(!syncOn())return false;
  try{
    const k=await cryptoKey();
    await rpc("duo_put",{p_space:k.space,p_owner:S.me.id,p_secret:k.write,p_data:await encrypt(syncPayload())});
    S.sync.lastPush=Date.now();SYNC_ERR="";saveRaw();return true;
  }catch(e){SYNC_ERR=netMsg(e);renderSafe();return false;}
}
async function pullNow(){
  if(!syncOn())return false;
  try{
    const k=await cryptoKey();
    const rows=(await rpc("duo_get",{p_space:k.space}))||[];
    const others=rows.filter(r=>r.owner!==S.me.id).sort((a,b)=>a.updated_at<b.updated_at?1:-1);
    if(others.length){
      let d;
      try{d=await decrypt(others[0].data);}catch(e){throw new Error("Impossible de déchiffrer les données reçues : la clé secrète n'est pas la même des deux côtés.");}
      if(d&&d.kind==="duo-budget"&&d.owner) applyPartner(d,others[0].updated_at);
    }
    S.sync.lastPull=Date.now();SYNC_ERR="";saveRaw();renderSafe();
    return {found:others.length>0,mine:rows.some(r=>r.owner===S.me.id)};
  }catch(e){SYNC_ERR=netMsg(e);renderSafe();return false;}
}
function netMsg(e){const m=String(e&&e.message||e);return /Failed to fetch|NetworkError|Load failed/i.test(m)?"Pas de connexion au serveur (hors ligne, ou projet Supabase en pause)":m;}
async function syncAll(manual){
  if(!syncOn()||SYNCING)return;
  SYNCING=true;
  if(manual) toast("Synchro en cours...");
  const r=await pullNow();
  const p=await pushNow();
  SYNCING=false;
  renderSafe();
  if(manual){
    if(r&&p) toast(r.found?`À jour avec ${pName()} ✓`:`Envoyé ✓ · ${pName()} n'est pas encore connecté·e`);
    else toast(SYNC_ERR||"Synchro impossible");
    if($("#bd").classList.contains("open")&&$("#set-duo")) openSettings("duo");
  }
}
function renderSafe(){
  const a=document.activeElement;
  if(a&&a.closest&&a.closest(".wrap")&&/INPUT|TEXTAREA/.test(a.tagName)) return;
  render();
}
function genPass(){
  const al="abcdefghjkmnpqrstuvwxyz23456789",r=crypto.getRandomValues(new Uint8Array(24));
  return [...r].map(x=>al[x%al.length]).join("").match(/.{6}/g).join("-");
}
function inviteCode(){return "DUO1."+b64(te.encode(JSON.stringify({u:S.sync.url,k:S.sync.key,p:S.sync.pass})));}
async function copyInvite(){
  const c=inviteCode();
  try{await navigator.clipboard.writeText(c);toast(`Code copié · envoie-le à ${pName()} en privé`);}
  catch(e){prompt("Copie ce code et envoie-le en privé :",c);}
}
let SY={url:"",key:"",pass:"",code:"",step:"choose"};
function openSyncSetup(){SY={url:S.sync.url||"",key:S.sync.key||"",pass:S.sync.pass||"",code:"",step:"choose"};renderSync();}
function renderSync(){
  let html=head("🔒 Connecter nos applis","Chiffré de bout en bout, rien que vous deux");
  if(SY.step==="choose"){
    html+=`<div class="muted" style="margin-top:6px;">Une seule personne fait la configuration (5 minutes), puis elle envoie un code à l'autre.</div>
      <button class="btn" style="margin-top:14px;" onclick="SY.step='create';renderSync()">C'est moi qui configure</button>
      <button class="btn ghost" onclick="SY.step='join';renderSync()">J'ai reçu un code</button>
      <div class="muted" style="margin-top:14px;">Comment c'est protégé : vos données sont chiffrées sur le téléphone avec une clé secrète que vous seuls connaissez, avant d'être envoyées. Le serveur ne stocke que du texte illisible, et l'appli sur GitHub ne contient aucune clé.</div>`;
  }else if(SY.step==="join"){
    html+=`<label class="lbl">Colle le code reçu</label><textarea id="sy-code" placeholder="DUO1.eyJ1Ijoi..." style="min-height:90px;font-size:13px;">${esc(SY.code)}</textarea>
      <div class="err" id="sy-err"></div>
      <button class="btn" style="margin-top:14px;" onclick="joinCode()">Se connecter</button>
      <button class="btn ghost" onclick="SY.step='choose';renderSync()">Retour</button>`;
  }else{
    html+=`<div class="chip-sec" style="margin-top:10px;">1 · Créer le coffre (gratuit)</div>
      <div class="muted">Va sur <b>supabase.com</b>, crée un compte puis un nouveau projet (région Europe). Dans le projet, ouvre <b>SQL Editor</b>, colle le script ci-dessous et clique sur <b>Run</b>.</div>
      <button class="btn ghost sm" style="margin-top:8px;" onclick="copySQL()">Copier le script SQL</button>
      <div class="chip-sec" style="margin-top:16px;">2 · Coller les infos du projet</div>
      <div class="muted">Dans Supabase : <b>Project Settings → API</b> (ou le bouton <b>Connect</b>). Copie la Project URL et la clé <b>anon / publishable</b> (jamais la clé secrète service_role).</div>
      <label class="lbl">Project URL</label><input id="sy-url" type="url" placeholder="https://xxxx.supabase.co" value="${esc(SY.url)}"/>
      <label class="lbl">Clé anon / publishable</label><input id="sy-key" type="text" placeholder="eyJhbGciOi... ou sb_publishable_..." value="${esc(SY.key)}" style="font-size:13px;"/>
      <div class="chip-sec" style="margin-top:16px;">3 · Votre clé secrète</div>
      <div class="muted">C'est elle qui chiffre tout. Garde celle générée, elle est très solide. Si vous la perdez tous les deux, les données en ligne sont illisibles (vos téléphones gardent quand même tout).</div>
      <div style="display:flex;gap:8px;margin-top:8px;"><input id="sy-pass" type="text" value="${esc(SY.pass||genPass())}" style="font-family:monospace;font-size:14px;"/><button class="btn ghost sm" style="flex-shrink:0;" onclick="SY.url=$('#sy-url').value;SY.key=$('#sy-key').value;SY.pass=genPass();renderSync()">↻</button></div>
      <div class="err" id="sy-err"></div>
      <button class="btn" style="margin-top:16px;" onclick="createSync()">Connecter</button>
      <button class="btn ghost" onclick="SY.step='choose';renderSync()">Retour</button>`;
  }
  openSheet(html);
}
async function copySQL(){try{await navigator.clipboard.writeText(SQL_SETUP);toast("Script copié, colle-le dans le SQL Editor");}catch(e){prompt("Copie ce script :",SQL_SETUP);}}
async function tryConnect(url,key,pass){
  const err=$("#sy-err");
  const fail=m=>{if(err){err.textContent=m;err.classList.add("show");}};
  if(!/^https:\/\/[^\s]+$/.test(url)) return fail("L'adresse doit commencer par https://");
  if(key.length<20) return fail("La clé du projet a l'air incomplète");
  if(pass.length<12) return fail("La clé secrète doit faire au moins 12 caractères");
  const old={...S.sync};
  S.sync={url:url.replace(/\/+$/,""),key,pass,lastPush:0,lastPull:0};CK=null;
  toast("Connexion...");
  const r=await pullNow();
  if(!r){const m=SYNC_ERR;S.sync=old;CK=null;SYNC_ERR="";saveRaw();return fail(m||"Connexion impossible");}
  const p=await pushNow();
  if(!p){const m=SYNC_ERR;S.sync=old;CK=null;SYNC_ERR="";saveRaw();return fail(m||"Envoi impossible");}
  saveRaw();
  return r;
}
async function createSync(){
  const r=await tryConnect($("#sy-url").value.trim(),$("#sy-key").value.trim(),$("#sy-pass").value.trim());
  if(!r)return;
  render();
  openSheet(head("C'est connecté ✓","")+`<div class="muted" style="margin-top:6px;">Dernière étape : envoie ce code à ${esc(pName())} <b>en privé</b> (WhatsApp, SMS...). Il ou elle le colle dans « Connecter nos applis → J'ai reçu un code ». Ce code donne accès à vos données : ne le poste nulle part et ne le mets jamais sur GitHub.</div>
    <button class="btn" style="margin-top:14px;" onclick="copyInvite()">Copier le code</button>
    <button class="btn ghost" onclick="closeSheet()">Fermer</button>`);
}
async function joinCode(){
  const err=$("#sy-err"),raw=$("#sy-code").value.trim();
  let c;
  try{if(!raw.startsWith("DUO1."))throw 0;c=JSON.parse(td.decode(unb64(raw.slice(5))));if(!c.u||!c.k||!c.p)throw 0;}
  catch(e){err.textContent="Ce code n'est pas reconnu, vérifie qu'il est complet";err.classList.add("show");return;}
  SY.code=raw;
  const r=await tryConnect(c.u,c.k,c.p);
  if(!r)return;
  closeSheet();render();
  toast(r.found?`Connecté·e ! Les données de ${pName()} sont arrivées 💛`:"Connecté·e ✓");
}
function syncOff(){
  if(!confirm("Déconnecter cet appareil ? Tes données restent sur ton téléphone, la synchro s'arrête juste ici."))return;
  S.sync={url:"",key:"",pass:"",lastPush:0,lastPull:0};CK=null;SYNC_ERR="";saveRaw();closeSheet();render();
}
async function exportData(share){
  const name=`budget-${(myName()).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"-")}-${today()}.json`;
  const blob=new Blob([JSON.stringify(payload())],{type:"application/json"});
  if(share){
    try{
      const f=new File([blob],name,{type:"application/json"});
      if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:"Mon budget",text:`Mes données budget pour ${pName()}`});toast("Envoyé !");return;}
    }catch(e){if(e&&e.name==="AbortError")return;}
  }
  const u=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);
  toast(share?`Fichier téléchargé, envoie-le à ${pName()} 📤`:"Sauvegarde téléchargée");
}
function importFile(input){
  const f=input.files&&input.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    input.value="";
    let d;
    try{d=JSON.parse(String(r.result).replace(/^﻿/,""));}catch(e){toast("Ce fichier n'est pas lisible");return;}
    if(!d||d.kind!=="duo-budget"||!d.owner||!d.owner.id){toast("Ce n'est pas un fichier de l'appli budget");return;}
    if(d.owner.id===S.me.id){
      if(!confirm("C'est ton propre fichier. Tu veux remplacer tes données actuelles par cette sauvegarde ?"))return;
      Object.assign(S,{categories:d.categories||S.categories,budgets:d.budgets||{},tx:d.tx||[],start:d.start||S.start,notes:d.notes||{},goal:d.goal||S.goal,bank:d.bank||{},theme:d.theme||S.theme,partnerName:d.partnerName||S.partnerName,partner:d.partner||S.partner});
      if(!S.goal.overrides) S.goal.overrides={};
      S.me.name=d.owner.name||S.me.name;
      save();LOCK=false;closeSheet();render();toast("Sauvegarde restaurée");return;
    }
    if(S.partner&&S.partner.id!==d.owner.id&&!confirm(`Ce fichier vient de « ${d.owner.name} », pas de ${pName()}. Remplacer quand même ?`))return;
    applyPartner(d);
    saveRaw();closeSheet();render();
    toast(`Données de ${pName()} importées · ${S.partner.tx.length} lignes 💛`);
  };
  r.readAsText(f,"UTF-8");
}
function removePartner(){if(!confirm(`Retirer les données de ${pName()} de ton appli ? Tes données à toi ne bougent pas.`))return;S.partner=null;save();closeSheet();render();}
function resetAll(){
  if(!confirm("Ça efface TOUT ce qui est dans l'appli sur ce téléphone. Tu as une sauvegarde ?"))return;
  if(!confirm("Vraiment sûr·e ?"))return;
  try{localStorage.removeItem(KEY);}catch(e){}
  location.reload();
}

function onboarding(){
  LOCK=true;
  openSheet(`<div class="sh-head"><div><h2>Bienvenue 💜</h2><div class="sh-sub">Deux prénoms et c'est parti</div></div></div>
    <label class="lbl">Ton prénom</label><input id="ob-me" type="text" placeholder="ex : Marion"/>
    <label class="lbl">Prénom de ton/ta partenaire</label><input id="ob-pa" type="text" placeholder="ex : Bilal"/>
    <div class="muted" style="margin-top:10px;">Tout démarre à 0. Encode ton salaire puis tes dépenses du mois, et l'appli calcule le reste toute seule.</div>
    <label class="lbl">Couleur</label><div class="theme-dots">${Object.entries(THEMES).map(([k,c])=>`<button style="background:${c};" class="${S.theme===k?"on":""}" onclick="obTheme('${k}',this)" aria-label="${k}"></button>`).join("")}</div>
    <div class="err" id="ob-err"></div>

}
function obTheme(k,el){S.theme=k;document.body.dataset.theme=k;document.querySelectorAll(".theme-dots button").forEach(b=>b.classList.toggle("on",b===el));}
function obSave(){
  const me=$("#ob-me").value.trim();
  if(!me){const e=$("#ob-err");e.textContent="Dis-moi au moins ton prénom";e.classList.add("show");return;}
  S.me.name=me;S.partnerName=$("#ob-pa").value.trim();
  S.start={perso:"",commun:"",epargne:""};
  PSC={};curMonth=curPer();S.goal.startMonth=curMonth;
  save();LOCK=false;closeSheet();render();toast(`Bienvenue ${me} 💜 Ton mois démarre dès que tu encodes ton salaire`);

let _tt=null;
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(_tt);_tt=setTimeout(()=>t.classList.remove("show"),Math.max(3400,m.length*65));}

curMonth=curPer();
render();
if(!S.me.name) onboarding();
else if(syncOn()) syncAll(false);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&syncOn()&&Date.now()-(S.sync.lastPull||0)>30000) syncAll(false);});
setInterval(()=>{if(document.visibilityState==="visible"&&syncOn()&&!$("#bd").classList.contains("open")) pullNow();},90000);
